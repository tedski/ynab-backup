[project]
name = "ynab-backup"
version = "0.1.0"
description = "Periodic YNAB budget backup and restore tool"
requires-python = ">=3.12"
dependencies = ["requests>=2.32,<3"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
ynab-backup = "ynab_backup.cli:main"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
